  <g font-family="Geist, Satoshi, Arial, sans-serif" fill="#0f172a">
    <text x="64" y="72" font-size="28" font-weight="700">skill sprawl</text>
    <text x="64" y="100" font-size="15" fill="#64748b">many triggers, uneven weight, hidden collisions</text>
    <text x="724" y="126" font-size="19" font-weight="700">health first</text>
    <text x="724" y="148" font-size="14" fill="#475569">broken metadata blocks reliable routing</text>
    <text x="724" y="252" font-size="19" font-weight="700">duplicates second</text>
    <text x="724" y="274" font-size="14" fill="#475569">one name needs one owner</text>
    <text x="724" y="378" font-size="19" font-weight="700">load profile third</text>
    <text x="724" y="400" font-size="14" fill="#475569">large and old skills become review candidates</text>
  </g>
  <g font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#64748b">
    <text x="64" y="468">seed: 1790 / deterministic lattice / read before prune</text>
    <text x="820" y="468">snapshot -> quarantine -> observe -> purge</text>
  </g>
