<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Signal lattice showing skill sprawl becoming an audit map</title>
  <desc id="desc">A deterministic network of skill nodes flowing from dense disorder on the left into grouped audit lanes on the right.</desc>
  <rect width="1200" height="520" rx="28" fill="#f8fafc"/>
  <path d="M46 420 C210 220 290 485 430 288 S720 120 1110 256" fill="none" stroke="#d4d4d8" stroke-width="1.2"/>
